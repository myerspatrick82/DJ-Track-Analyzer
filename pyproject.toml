[project]
name = "dj-track-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "myersps", email = "myerspatrick82@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.157.0",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dj-track-analyzer = "dj_track_analyzer:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
